<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>人生ゲーム - 最大4人対応版</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#eef2ff,#faf5ff);color:#171717}
.app{max-width:800px;margin:auto;padding:18px 14px 30px}
.title{text-align:center;font-size:28px;font-weight:800;margin:8px 0 14px}

/* 人数設定エリア */
.setup-container{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 2px 10px #0001}
.setup-container label{font-weight:700;font-size:14px}
.setup-container select{padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;font-size:15px;font-weight:700}

/* プレイヤー一覧（人数の変動に応じて自動調整） */
.players-container{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:10px;margin-bottom:14px}
.player-section{background:#fff;border-radius:14px;padding:10px;box-shadow:0 3px 12px #0001;border-top:5px solid #ccc;transition:.2s}
.p-name{font-size:14px;font-weight:800;text-align:center;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.card{background:#f8fafc;border-radius:8px;padding:6px 2px;text-align:center}
.label{font-size:10px;color:#64748b}.value{font-size:12px;font-weight:800;margin-top:2px}
.progress-container{height:6px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-top:6px}
.bar{height:100%;width:0%;transition:.3s}

/* 盤面表示 */
.board{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:14px 0}
.cell{height:24px;background:#fff;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 3px #0001;position:relative}
.cell-num{font-size:6px;color:#94a3b8;transform:scale(0.85);line-height:1}
.cell-pieces{display:flex;gap:1px;margin-top:1px;font-size:7px;line-height:1;flex-wrap:wrap;justify-content:center}
.start .cell-num, .goal .cell-num { font-size: 6px; font-weight: 800; }
.start { background: #f1f5f9!important; }
.goal{background:#22c55e!important;color:#fff}.goal .cell-num{color:#fff}

.message{background:#fff;border-radius:18px;margin:14px 0;padding:16px;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 3px 15px #0001;font-size:15px;white-space:pre-wrap;line-height:1.5}

/* ボタン各種 */
button{border:0;border-radius:16px;padding:16px;width:100%;font-size:18px;font-weight:800;color:white;transition:.2s;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.reset{background:#fff;color:#64748b;margin-top:9px;border:1px solid #cbd5e1;font-size:14px;padding:12px}
.result{display:none;text-align:center;background:#fff;border-radius:18px;padding:24px;margin-top:14px;box-shadow:0 4px 20px #0001}.show{display:block}

/* プレイヤーごとの色設定 */
.p-color-0 { border-color: #3b82f6!important; color: #3b82f6; }
.p-color-1 { border-color: #ef4444!important; color: #ef4444; }
.p-color-2 { border-color: #22c55e!important; color: #22c55e; }
.p-color-3 { border-color: #eab308!important; color: #ca8a04; }

.bar-0 { background: #3b82f6; }
.bar-1 { background: #ef4444; }
.bar-2 { background: #22c55e; }
.bar-3 { background: #eab308; }

.btn-p0 { background: #3b82f6; } .btn-p0:hover { background: #2563eb; }
.btn-p1 { background: #ef4444; } .btn-p1:hover { background: #dc2626; }
.btn-p2 { background: #22c55e; } .btn-p2:hover { background: #16a34a; }
.btn-p3 { background: #eab308; } .btn-p3:hover { background: #ca8a04; }

@media(max-width:600px){
  .board{grid-template-columns:repeat(10,1fr)}
  .players-container{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="title">🎲 人生ゲーム</div>

<!-- プレイ人数選択 -->
<div class="setup-container">
  <label for="player-count">プレイ人数:</label>
  <select id="player-count">
    <option value="2">2人</option>
    <option value="3">3人</option>
    <option value="4" selected>4人</option>
  </select>
</div>

<!-- プレイヤー別ステータス表示（JavaScriptで動的生成） -->
<div class="players-container" id="players-container"></div>

<div class="board" id="board"></div>
<div class="message" id="message">ゲーム開始！プレイヤー1の番です。</div>
<button id="roll" class="btn-p0">🔵 プレイヤー1がサイコロを振る</button>
<button class="reset" id="reset">最初からやり直す</button>
<div class="result" id="result"></div>
</div>

<script>
// 基本プレイヤー定義テンプレート
const PLAYER_CONFIGS = [
  { color: "🔵", name: "プレイヤー1" },
  { color: "🔴", name: "プレイヤー2" },
  { color: "🟢", name: "プレイヤー3" },
  { color: "🟡", name: "プレイヤー4" }
];

const events=[
  ["💼","ボーナス！",200000],
  ["✈️","旅行に行った。20万円使った。",-200000],
  ["💻","副業が当たった！30万円獲得。",300000],
  ["📈","株が上昇！25万円の利益。",250000],
  ["🔧","家電が壊れた……10万円の出費。",-100000],
  ["🎁","臨時収入！15万円ゲット。",150000],
  ["😌","今日は何も起こらなかった。",0]
];

let players = [];
let turn = 0;
let gameOver = false;
let goalRank = 1;

const $=x=>document.getElementById(x);
function yen(n){return "¥"+Math.round(n).toLocaleString("ja-JP")}

// ゲーム初期化（人数変更時・リセット時）
function initGame(){
  const count = parseInt($("player-count").value, 10);
  players = [];
  for(let i=0; i<count; i++){
    players.push({
      id: i,
      pos: 0,
      age: 20,
      money: 1000000,
      color: PLAYER_CONFIGS[i].color,
      name: PLAYER_CONFIGS[i].name,
      isGoal: false
    });
  }
  turn = 0;
  gameOver = false;
  goalRank = 1;

  // プレイヤー表示枠を動的に構築
  const pContainer = $("players-container");
  pContainer.innerHTML = "";
  players.forEach((p, idx) => {
    const div = document.createElement("div");
    div.className = `player-section p-color-${idx}`;
    div.id = `p-section-${idx}`;
    div.innerHTML = `
      <div class="p-name p-color-${idx}">${p.name} (${p.color})</div>
      <div class="stats">
        <div class="card"><div class="label">年齢</div><div class="value" id="p${idx}-age">${p.age}歳</div></div>
        <div class="card"><div class="label">資産</div><div class="value" id="p${idx}-money">${yen(p.money)}</div></div>
        <div class="card"><div class="label">マス</div><div class="value" id="p${idx}-pos">${p.pos}/30</div></div>
      </div>
      <div class="progress-container"><div class="bar bar-${idx}" id="p${idx}-bar"></div></div>
    `;
    pContainer.appendChild(div);
  });

  $("message").textContent = `ゲーム開始！${players[0].name}の番です。`;
  $("result").className = "result";
  $("roll").disabled = false;
  render();
}

function render(){
  // 各プレイヤーのステータス更新
  players.forEach((p, idx) => {
    $(`p${idx}-age`).textContent = p.age + "歳";
    $(`p${idx}-money`).textContent = yen(p.money);
    $(`p${idx}-pos`).textContent = p.pos + " / 30";
    $(`p${idx}-bar`).style.width = (p.pos / 30 * 100) + "%";
  });

  // 盤面の描画
  let b = $("board");
  b.innerHTML = "";
  for(let i=0; i<=30; i++){
    let d = document.createElement("div");
    d.className = "cell " + (i==0 ? "start" : i==30 ? "goal" : "");
    
    let numSpan = document.createElement("span");
    numSpan.className = "cell-num";
    numSpan.textContent = i==0 ? "START" : i==30 ? "GOAL" : i;
    d.appendChild(numSpan);

    let piecesDiv = document.createElement("div");
    piecesDiv.className = "cell-pieces";
    players.forEach(p => {
      if(p.pos === i) piecesDiv.innerHTML += p.color;
    });
    d.appendChild(piecesDiv);

    b.appendChild(d);
  }

  // ボタンの手番デザイン適用
  if(!gameOver) {
    const nextP = players[turn];
    $("roll").className = `btn-p${nextP.id}`;
    $("roll").textContent = `${nextP.color} ${nextP.name}がサイコロを振る`;
  }
}

// 次のターンへ進む（ゴール済みの人はスキップ）
function advanceTurn(){
  if(players.every(p => p.isGoal)) return;
  let next = (turn + 1) % players.length;
  while(players[next].isGoal){
    next = (next + 1) % players.length;
  }
  turn = next;
}

$("roll").onclick = () => {
  if(gameOver) return;
  $("roll").disabled = true;
  
  let p = players[turn];
  $("message").textContent = `${p.color} ${p.name}がサイコロを振っています…`;

  setTimeout(() => {
    let dice = Math.floor(Math.random()*6) + 1;
    p.pos = Math.min(30, p.pos + dice);
    p.age += dice;
    p.money += dice * 70000;

    let logMessage = `🎲 ${p.name}は ${dice} マス進んだ！\n`;

    // ゴール到達処理
    if(p.pos >= 30 && !p.isGoal){
      p.isGoal = true;
      let bonus = 0;
      if(goalRank === 1) bonus = 500000;
      else if(goalRank === 2) bonus = 300000;
      else if(goalRank === 3) bonus = 100000;

      p.money += bonus;
      logMessage += `🏁 ${goalRank}着でゴール！${bonus > 0 ? `（先着ボーナス ${yen(bonus)}獲得）` : ''}`;
      goalRank++;
    } else {
      let e = events[Math.floor(Math.random() * events.length)];
      p.money += e[2];
      logMessage += `【イベント】${e[0]} ${e[1]}`;
    }

    $("message").textContent = logMessage;

    // 全員ゴール完了の判定
    if(players.every(player => player.isGoal)){
      gameOver = true;
      render();
      $("roll").disabled = true;
      
      // 資産額でソートしてランキング作成
      let ranked = [...players].sort((a, b) => b.money - a.money);
      $("result").className = "result show";
      
      let resultHtml = `<h2>🎉 全員ゴール！最終結果</h2><div style="margin:12px 0; text-align:left; display:inline-block;">`;
      ranked.forEach((rk, idx) => {
        let crown = idx === 0 ? "👑 " : `${idx+1}位: `;
        resultHtml += `<div style="font-size:15px; margin-bottom:6px;">
          ${crown}<strong>${rk.name} (${rk.color})</strong> - 最終資産: <strong>${yen(rk.money)}</strong>
        </div>`;
      });
      resultHtml += `</div>`;
      $("result").innerHTML = resultHtml;
      return;
    }

    advanceTurn();
    render();
    $("roll").disabled = false;
  }, 600);
};

// 人数選択を変更したとき
$("player-count").onchange = () => {
  initGame();
};

// リセットボタン
$("reset").onclick = () => {
  initGame();
};

// 初期表示
initGame();
</script>
</body>
</html>
